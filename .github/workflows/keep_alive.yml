name: Keep Streamlit App Alive

on:
  schedule:
    # 매일 00:00 UTC에 실행 (한국 시간 오전 9시)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동으로 실행하고 싶을 때 사용

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -I https://your-app-name.streamlit.app/
