name: Keep Streamlit App Alive (Every 6 Hours)

on:
  schedule:
    # 6시간마다 실행 (0분, 6의 배수 시간)
    - cron: '0 */6 * * *'
  workflow_dispatch: # 필요할 때 수동으로도 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          # -L은 리다이렉트 허용, -s는 정적 모드(로그 간소화)
          curl -Ls -I https://your-app-name.streamlit.app/ | grep "HTTP/"
